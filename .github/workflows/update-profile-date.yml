name: Update profile date

on:
  schedule:
    - cron: '7 0 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-profile-date
  cancel-in-progress: false

jobs:
  update-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Update the date in Beijing time
        run: python3 .github/scripts/update_profile_date.py
      - name: Commit the updated date
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update profile date'
          git push origin HEAD:main
